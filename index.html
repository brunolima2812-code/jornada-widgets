<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#191c27"><title>Farol da Jornada · Panorâmico</title><style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;color:#f1e9f0;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.widget{width:100%;max-width:1100px;margin:0 auto;background:#1c1c27;border:1px solid #413b4b;border-radius:15px;overflow:hidden}.panorama{position:relative;min-height:170px;aspect-ratio:2.7/1;max-height:310px;background:#19233a;overflow:hidden}.panorama svg{width:100%;height:100%;display:block}.overlay{position:absolute;right:4%;top:50%;transform:translateY(-50%);width:42%;max-width:330px;padding:15px 18px;border:1px solid rgba(237,218,237,.15);border-radius:11px;background:rgba(23,25,37,.76);backdrop-filter:blur(7px)}.eyebrow{color:#d7c0dc;font-size:10px;letter-spacing:.19em;font-weight:700}.clock{font-family:Georgia,serif;font-size:clamp(27px,5.5vw,49px);font-variant-numeric:tabular-nums;line-height:1.16;margin:6px 0 8px}.weather-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.temp{font-size:clamp(16px,2.7vw,24px);font-weight:500}.condition{font-size:clamp(11px,1.7vw,14px);color:#e0d2e0}.location{font-size:11px;color:#c2b2c6;margin-top:9px}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 16px;font-size:11px;color:#c6b7ca}.footer span:first-child{font-family:Georgia,serif;font-size:14px;color:#e8dce8}#clouds,#rain,#stars,#beam,#sun,#moon,#bolt{transition:opacity 1.1s}#beam{transform-origin:45% 29%;animation:sweep 9s ease-in-out infinite alternate}@keyframes sweep{from{transform:rotate(-6deg)}to{transform:rotate(7deg)}}.wave{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{to{transform:translateX(-12px)}}@media(max-width:520px){.panorama{aspect-ratio:2.15/1;min-height:150px}.overlay{right:3%;width:48%;padding:9px 10px}.eyebrow{font-size:8px;letter-spacing:.1em}.clock{font-size:29px;margin:3px 0 5px}.weather-row{gap:4px 8px}.temp{font-size:17px}.condition{font-size:11px}.location{font-size:9px;margin-top:5px}.footer{padding:7px 11px;font-size:9px}.footer span:first-child{font-size:12px}}@media(prefers-reduced-motion:reduce){#beam,.wave{animation:none}}
</style></head><body><main class="widget"><section class="panorama" aria-label="Farol com paisagem que acompanha o horário e o clima"><svg viewBox="0 0 800 280" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Farol diante do mar, com céu e clima variáveis"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop id="sky1" offset="0%" stop-color="#15203b"/><stop id="sky2" offset="100%" stop-color="#77708b"/></linearGradient><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop id="sea1" stop-color="#47546c"/><stop id="sea2" offset="100%" stop-color="#263449"/></linearGradient><linearGradient id="light" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffe5a7" stop-opacity=".43"/><stop offset="100%" stop-color="#ffe5a7" stop-opacity="0"/></linearGradient></defs><rect width="800" height="280" fill="url(#sky)"/><g id="stars" fill="#f7ebd7"><circle cx="95" cy="30" r="1.7"/><circle cx="180" cy="75" r="1.2"/><circle cx="300" cy="28" r="1.6"/><circle cx="520" cy="34" r="1.5"/><circle cx="665" cy="65" r="1.4"/><circle cx="740" cy="25" r="1.2"/><circle cx="575" cy="91" r="1"/><circle cx="45" cy="100" r="1"/></g><circle id="sun" cx="640" cy="74" r="32" fill="#f4d4a2"/><path id="moon" d="M638 35 A30 30 0 1 0 670 85 A26 26 0 1 1 638 35" fill="#efe4d6"/><g id="clouds" fill="#b6b1c0" opacity=".8"><path d="M70 80 Q67 61 91 60 Q102 36 129 51 Q155 40 165 64 Q191 65 190 82Z"/><path d="M525 110 Q525 89 549 90 Q566 62 590 84 Q621 78 631 106Z"/><path d="M310 58 Q313 39 337 43 Q356 18 382 40 Q411 38 418 60Z"/></g><g id="rain" stroke="#c2c9d8" stroke-width="2" opacity=".7"><path d="M70 102l-9 23m32-19l-9 23m46-22l-9 23m39-21l-9 23m164-50l-9 23m30-17l-9 23m41-25l-9 23m166 20l-9 23m40-18l-9 23m44-21l-9 23m39-19l-9 23m37-16l-9 23"/></g><path id="bolt" d="M560 95l-22 40h19l-22 45" stroke="#fff1c8" stroke-width="5" fill="none"/><path d="M0 184Q110 166 220 184T440 184T660 184T880 184V280H0Z" fill="url(#sea)"/><g class="wave" stroke="#b9bec9" stroke-opacity=".26" stroke-width="2" fill="none"><path d="M-20 211Q100 195 220 211T460 211T700 211T940 211"/><path d="M-20 243Q100 227 220 243T460 243T700 243T940 243"/><path d="M-20 270Q100 254 220 270T460 270T700 270T940 270"/></g><path d="M180 280L278 216L395 213L481 280Z" fill="#343944"/><path d="M289 233L305 91H356L374 233Z" fill="#e0d6c8" stroke="#93838b" stroke-width="3"/><path d="M299 166H366" stroke="#a05f6a" stroke-width="25"/><path d="M305 111H356" stroke="#a05f6a" stroke-width="13"/><path d="M302 91V72H360V91Z" fill="#fbe5ac" stroke="#80656e" stroke-width="3"/><path d="M294 72L331 47L370 72Z" fill="#69545f"/><path d="M291 68H371" stroke="#8d7881" stroke-width="4"/><rect x="321" y="198" width="18" height="35" rx="8" fill="#59505c"/><g id="beam"><path d="M360 80L800 0V184Z" fill="url(#light)"/></g><path d="M0 275Q100 250 200 271T400 265T600 269T800 260V280H0Z" fill="#2a3442"/></svg><div class="overlay"><div class="eyebrow">JORNADA · FAROL DO TEMPO</div><div class="clock" id="clock">--:--</div><div class="weather-row"><span class="temp" id="temp">--°C</span><span class="condition" id="condition">Consultando clima…</span></div><div class="location">Osasco · Barueri, SP</div></div></section><div class="footer"><span>Uma luz no horizonte.</span><span id="date">Atualizando data…</span></div></main><script>
const $=id=>document.getElementById(id),zone='America/Sao_Paulo';let currentCode=null;let currentTemp=null;let sunrise='06:00',sunset='18:00';function opacity(id,v){$(id).style.opacity=v}function category(c){if([95,96,99].includes(c))return 'storm';if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(c))return 'rain';if([1,2,3,45,48].includes(c))return 'cloud';return 'sun'}function label(c){if(c===0)return 'Céu limpo';if(c===1)return 'Poucas nuvens';if(c===2)return 'Parcialmente nublado';if(c===3)return 'Nublado';if([45,48].includes(c))return 'Neblina';if([95,96,99].includes(c))return 'Tempestade';if([51,53,55,56,57].includes(c))return 'Garoa';if([80,81,82].includes(c))return 'Pancadas de chuva';if([61,63,65,66,67].includes(c))return 'Chuva';return 'Condição variável'}function mins(s){let m=String(s).match(/(\d{2}):(\d{2})(?::\d{2})?$/);return m?Number(m[1])*60+Number(m[2]):360}function update(){const now=new Date();const clock=new Intl.DateTimeFormat('pt-BR',{timeZone:zone,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(now);$('clock').textContent=clock;const hm=mins(clock),sr=mins(sunrise),ss=mins(sunset);let period=hm<sr-30||hm>ss+30?'night':hm<sr+90?'dawn':hm>ss-90?'dusk':'day';$('date').textContent=new Intl.DateTimeFormat('pt-BR',{timeZone:zone,weekday:'short',day:'numeric',month:'short'}).format(now);const palettes={night:['#15203b','#66627d','#34435b','#1f2e45'],dawn:['#705069','#e2a88c','#806b82','#394258'],day:['#6e9aaf','#d0c4b2','#557e90','#324b64'],dusk:['#68455f','#d38e82','#6e627b','#334057']};const colors=palettes[period];['sky1','sky2','sea1','sea2'].forEach((id,i)=>$(id).setAttribute('stop-color',colors[i]));const w=category(currentCode);opacity('stars',period==='night'?1:0);opacity('moon',period==='night'?1:0);opacity('sun',period==='night'?0:1);opacity('clouds',w==='sun'?.18:1);opacity('rain',w==='rain'||w==='storm'?1:0);opacity('bolt',w==='storm'?1:0);opacity('beam',period==='night'||period==='dusk'||w==='storm'||w==='rain'?1:.12)}async function weather(){try{const url='https://api.open-meteo.com/v1/forecast?latitude=-23.51&longitude=-46.88&current=temperature_2m,weather_code&daily=sunrise,sunset&timezone=America%2FSao_Paulo&forecast_days=1';const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw Error('weather');const data=await res.json();currentCode=data.current.weather_code;currentTemp=data.current.temperature_2m;sunrise=data.daily?.sunrise?.[0]||sunrise;sunset=data.daily?.sunset?.[0]||sunset;$('temp').textContent=Math.round(currentTemp)+'°C';$('condition').textContent=label(currentCode);update()}catch(e){$('condition').textContent='Clima indisponível';$('temp').textContent='--°C';update()}}update();weather();setInterval(update,30000);setInterval(weather,15*60*1000);
</script></body></html>
