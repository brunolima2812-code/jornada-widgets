<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farol da Jornada</title><style>
*{box-sizing:border-box}body{margin:0;background:#151821;color:#e9e3eb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.widget{max-width:920px;margin:auto;background:#1c1c27;border:1px solid #3a3545;border-radius:16px;overflow:hidden}.head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 10px;gap:10px}.eyebrow{font-size:11px;letter-spacing:.2em;color:#d1bddb;font-weight:700}.clock{font-variant-numeric:tabular-nums;font-size:24px;font-weight:300}.scene{position:relative;height:250px;overflow:hidden;background:linear-gradient(#17233b,#5b5975);transition:background 1.5s}.scene svg{width:100%;height:100%;display:block}.info{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px 17px;flex-wrap:wrap}.title{font-family:Georgia,serif;font-size:20px}.sub{color:#b8acbf;font-size:12px;margin-top:5px}.weather{font-size:13px;color:#d8c6dd;text-align:right}.controls{display:flex;gap:6px;padding:0 20px 15px;flex-wrap:wrap}button{border:1px solid #55485d;background:#2b2735;color:#e6d9eb;border-radius:20px;padding:6px 12px;font-size:11px;cursor:pointer}button.active{background:#775a80;border-color:#a882af}#clouds,#rain,#stars,#beam,#sun,#moon,#bolt{transition:opacity 1.1s}#beam{transform-origin:49% 29%;animation:sweep 9s ease-in-out infinite alternate}@keyframes sweep{from{transform:rotate(-9deg)}to{transform:rotate(10deg)}}.wave{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{to{transform:translateX(-14px)}}@media(max-width:520px){.scene{height:195px}.clock{font-size:20px}.title{font-size:18px}.info{align-items:flex-start}.weather{text-align:left}}
</style></head><body><main class="widget"><div class="head"><div class="eyebrow">JORNADA · FAROL DO TEMPO</div><div class="clock" id="clock">--:--</div></div><div class="scene" id="scene"><svg viewBox="0 0 800 280" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Farol diante do mar, com céu e clima variáveis"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop id="sky1" offset="0%" stop-color="#15203b"/><stop id="sky2" offset="100%" stop-color="#77708b"/></linearGradient><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop id="sea1" stop-color="#47546c"/><stop id="sea2" offset="100%" stop-color="#263449"/></linearGradient><linearGradient id="light" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffe5a7" stop-opacity=".43"/><stop offset="100%" stop-color="#ffe5a7" stop-opacity="0"/></linearGradient></defs><rect width="800" height="280" fill="url(#sky)"/><g id="stars" fill="#f7ebd7"><circle cx="95" cy="30" r="1.7"/><circle cx="180" cy="75" r="1.2"/><circle cx="300" cy="28" r="1.6"/><circle cx="520" cy="34" r="1.5"/><circle cx="665" cy="65" r="1.4"/><circle cx="740" cy="25" r="1.2"/><circle cx="575" cy="91" r="1"/><circle cx="45" cy="100" r="1"/></g><circle id="sun" cx="640" cy="74" r="32" fill="#f4d4a2"/><path id="moon" d="M638 35 A30 30 0 1 0 670 85 A26 26 0 1 1 638 35" fill="#efe4d6"/><g id="clouds" fill="#b6b1c0" opacity=".8"><path d="M70 80 Q67 61 91 60 Q102 36 129 51 Q155 40 165 64 Q191 65 190 82Z"/><path d="M525 110 Q525 89 549 90 Q566 62 590 84 Q621 78 631 106Z"/><path d="M310 58 Q313 39 337 43 Q356 18 382 40 Q411 38 418 60Z"/></g><g id="rain" stroke="#c2c9d8" stroke-width="2" opacity=".7"><path d="M70 102l-9 23m32-19l-9 23m46-22l-9 23m39-21l-9 23m164-50l-9 23m30-17l-9 23m41-25l-9 23m166 20l-9 23m40-18l-9 23m44-21l-9 23m39-19l-9 23m37-16l-9 23"/></g><path id="bolt" d="M560 95l-22 40h19l-22 45" stroke="#fff1c8" stroke-width="5" fill="none"/><path d="M0 184Q110 166 220 184T440 184T660 184T880 184V280H0Z" fill="url(#sea)"/><g class="wave" stroke="#b9bec9" stroke-opacity=".26" stroke-width="2" fill="none"><path d="M-20 211Q100 195 220 211T460 211T700 211T940 211"/><path d="M-20 243Q100 227 220 243T460 243T700 243T940 243"/><path d="M-20 270Q100 254 220 270T460 270T700 270T940 270"/></g><path d="M180 280L278 216L395 213L481 280Z" fill="#343944"/><path d="M289 233L305 91H356L374 233Z" fill="#e0d6c8" stroke="#93838b" stroke-width="3"/><path d="M299 166H366" stroke="#a05f6a" stroke-width="25"/><path d="M305 111H356" stroke="#a05f6a" stroke-width="13"/><path d="M302 91V72H360V91Z" fill="#fbe5ac" stroke="#80656e" stroke-width="3"/><path d="M294 72L331 47L370 72Z" fill="#69545f"/><path d="M291 68H371" stroke="#8d7881" stroke-width="4"/><rect x="321" y="198" width="18" height="35" rx="8" fill="#59505c"/><g id="beam"><path d="M360 80L800 0V184Z" fill="url(#light)"/></g><path d="M0 275Q100 250 200 271T400 265T600 269T800 260V280H0Z" fill="#2a3442"/></svg></div><div class="info"><div><div class="title">Uma luz no horizonte.</div><div class="sub" id="date">Osasco · Barueri, São Paulo</div></div><div class="weather" id="weather">Consultando o clima...</div></div><div class="controls" aria-label="Simulação visual"><button data-mode="auto" class="active">Automático</button><button data-mode="sun">Sol</button><button data-mode="cloud">Nuvens</button><button data-mode="rain">Chuva</button><button data-mode="storm">Tempestade</button><button data-mode="night">Noite</button></div></main><script>
const $=id=>document.getElementById(id);let mode='auto',currentCode=0;const zone='America/Sao_Paulo';function setOpacity(id,n){$(id).style.opacity=n}function weatherMode(code){if([95,96,99].includes(code))return 'storm';if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code))return 'rain';if([1,2,3,45,48].includes(code))return 'cloud';return 'sun'}function update(){const now=new Date(),parts=new Intl.DateTimeFormat('pt-BR',{timeZone:zone,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(now);const h=Number(parts.find(p=>p.type==='hour').value);$('clock').textContent=new Intl.DateTimeFormat('pt-BR',{timeZone:zone,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(now);$('date').textContent=new Intl.DateTimeFormat('pt-BR',{timeZone:zone,weekday:'long',day:'numeric',month:'long'}).format(now)+' · Osasco–Barueri';let period=h<6?'night':h<9?'dawn':h<17?'day':h<19?'dusk':'night';if(mode==='night')period='night';const palette={night:['#15203b','#66627d','#34435b','#1f2e45'],dawn:['#705069','#e2a88c','#806b82','#394258'],day:['#6e9aaf','#d0c4b2','#557e90','#324b64'],dusk:['#68455f','#d38e82','#6e627b','#334057']}[period];['sky1','sky2','sea1','sea2'].forEach((id,i)=>$(id).setAttribute('stop-color',palette[i]));let w=mode==='auto'||mode==='night'?weatherMode(currentCode):mode;setOpacity('stars',period==='night'?1:0);setOpacity('moon',period==='night'?1:0);setOpacity('sun',period==='night'?0:1);setOpacity('clouds',w==='sun'?.15:1);setOpacity('rain',w==='rain'||w==='storm'?1:0);setOpacity('bolt',w==='storm'?1:0);setOpacity('beam',period==='night'||period==='dusk'||w==='storm'||w==='rain'?1:.12);if(mode!=='auto')$('weather').textContent='Prévia: '+({sun:'sol',cloud:'nuvens',rain:'chuva',storm:'tempestade',night:'noite'}[mode]);}async function getWeather(){try{const u='https://api.open-meteo.com/v1/forecast?latitude=-23.51&longitude=-46.88&current=weather_code,temperature_2m&timezone=America%2FSao_Paulo';const res=await fetch(u);if(!res.ok)throw Error('falha');const data=await res.json();currentCode=data.current.weather_code;const label={sun:'Céu limpo',cloud:'Nublado',rain:'Chuva',storm:'Tempestade'}[weatherMode(currentCode)];if(mode==='auto')$('weather').textContent=label+' · '+Math.round(data.current.temperature_2m)+'°C';update()}catch(e){if(mode==='auto')$('weather').textContent='Clima indisponível · relógio ativo';update()}}document.querySelectorAll('button[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('button[data-mode]').forEach(x=>x.classList.toggle('active',x===b));update();if(mode==='auto')getWeather()}));update();getWeather();setInterval(update,30000);setInterval(getWeather,15*60*1000);
</script></body></html>
