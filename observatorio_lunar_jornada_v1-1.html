<script>
(function(){
const CYCLE=29.530588853, NEW_MOON=Date.UTC(2000,0,6,18,14);
const phaseNames=['Lua nova','Lua crescente','Quarto crescente','Gibosa crescente','Lua cheia','Gibosa minguante','Quarto minguante','Lua minguante'];
function drawMoon(fraction){
 const cx=667,cy=106,r=43,n=90,waning=fraction>=.5,k=Math.cos(2*Math.PI*fraction),pts=[];
 for(let i=0;i<=n;i++){const a=-Math.PI/2+Math.PI*i/n;pts.push([cx+(waning?1:-1)*r*Math.cos(a),cy+r*Math.sin(a)])}
 for(let i=n;i>=0;i--){const a=-Math.PI/2+Math.PI*i/n;pts.push([cx+(waning?-1:1)*r*k*Math.cos(a),cy+r*Math.sin(a)])}
 document.getElementById('moonShape').setAttribute('d',pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(2)+' '+p[1].toFixed(2)).join(' ')+' Z');
}
function update(){
 const now=new Date(), hour=now.getHours()+now.getMinutes()/60;
 const age=(((now.getTime()-NEW_MOON)/86400000)%CYCLE)+CYCLE)%CYCLE, fraction=age/CYCLE;
 const illum=Math.round((1-Math.cos(2*Math.PI*fraction))*50);
 let name=phaseNames[Math.floor(((fraction+1/16)%1)*8)];
 document.getElementById('phaseText').textContent=name;
 document.getElementById('detailText').textContent='Iluminação estimada: '+illum+'% · '+now.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});
 drawMoon(fraction);
 let colors,starOpacity,windowColor;
 if(hour>=6&&hour<16){colors=['#5e5686','#9b83b3','#e4b9c3'];starOpacity=0;windowColor='#392d4a'}
 else if(hour>=16&&hour<19){colors=['#49365f','#91658c','#dfa4a5'];starOpacity=.35;windowColor='#f0c9aa'}
 else if(hour>=4.5&&hour<6){colors=['#4a3c70','#a07da9','#e9b9c0'];starOpacity=.35;windowColor='#f0c9aa'}
 else{colors=['#10112a','#34254f','#76568a'];starOpacity=1;windowColor='#f0c9aa'}
 ['top','middle','bottom'].forEach((id,i)=>document.getElementById(id).setAttribute('stop-color',colors[i]));
 document.getElementById('stars').style.opacity=starOpacity;
 document.getElementById('win1').setAttribute('fill',windowColor);
 document.getElementById('win2').setAttribute('fill',windowColor);
 document.getElementById('glow').style.opacity=hour>=6&&hour<16?.2:1;
}

update();setInterval(update,60000);
})();
</script></body></html>
