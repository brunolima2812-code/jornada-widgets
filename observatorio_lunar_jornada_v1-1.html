<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Observatório Lunar — Jornada</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;background:transparent;overflow:hidden}
.scene{position:relative;width:100%;aspect-ratio:3/1;min-height:180px;max-height:420px;overflow:hidden;border-radius:16px;background:#19142f}
svg{display:block;width:100%;height:100%}
.label{position:absolute;left:3.3%;top:8%;color:#f5e9ff;text-shadow:0 2px 9px #171026;font-family:Georgia,serif;font-size:clamp(15px,2.5vw,27px);letter-spacing:.02em}
.sub{position:absolute;left:3.5%;top:20%;font:clamp(8px,1vw,11px) system-ui,sans-serif;letter-spacing:.22em;color:#dac6e9}
.mooninfo{position:absolute;right:4%;bottom:9%;text-align:right;color:#f5eaff;font:clamp(10px,1.3vw,15px) system-ui,sans-serif;text-shadow:0 2px 7px #171026}
.mooninfo small{display:block;font-size:.8em;opacity:.8;margin-top:3px}
@media(max-width:520px){.scene{min-height:150px;aspect-ratio:2.4/1}.sub{top:25%}.mooninfo{bottom:7%}}
@media(prefers-reduced-motion:no-preference){#stars{animation:twinkle 8s ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.65}}}
</style></head>
<body><main class="scene" aria-label="Observatório Lunar: paisagem que acompanha o horário e a fase da Lua">
<svg viewBox="0 0 900 300" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Observatório sobre uma colina sob o céu">
<defs>
<linearGradient id="sky" x2="0" y2="1"><stop id="top" offset="0%" stop-color="#10112a"/><stop id="middle" offset="65%" stop-color="#34254f"/><stop id="bottom" offset="100%" stop-color="#8b638e"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#d5b8f1" stop-opacity=".40"/><stop offset="1" stop-color="#d5b8f1" stop-opacity="0"/></radialGradient>
<clipPath id="moonclip"><circle cx="667" cy="106" r="43"/></clipPath>
</defs>
<rect width="900" height="300" fill="url(#sky)"/>
<g id="stars"></g>
<circle cx="667" cy="106" r="92" fill="url(#halo)" id="glow"/>
<circle cx="667" cy="106" r="43" fill="#211c3d" stroke="#8a749e" stroke-width="1.2"/>
<g clip-path="url(#moonclip)"><image id="moonImage" x="624" y="63" width="86" height="86"/></g>
<path d="M0 245 Q150 189 316 238 T900 224 V300 H0Z" fill="#57466b"/>
<path d="M0 280 Q174 232 360 276 T900 257 V300 H0Z" fill="#322742"/>
<!-- Observatory -->
<g transform="translate(118 111)">
<rect x="30" y="85" width="186" height="125" fill="#40314f"/>
<rect x="44" y="95" width="156" height="115" fill="#4c3a60"/>
<path d="M13 86 A110 110 0 0 1 233 86Z" fill="#73578e" stroke="#b594d0" stroke-width="3"/>
<!-- dome slit and telescope -->
<path d="M124 -24 Q160 -10 182 14 L156 42 L120 24Z" fill="#19172e" stroke="#a588bf" stroke-width="2"/>
<g transform="rotate(-9 145 22)">
<path d="M119 30 L194 -25 L207 -7 L130 49Z" fill="#c5a6da" stroke="#f0d7ff" stroke-width="2"/>
<path d="M190 -28 L211 -42 L226 -17 L205 -3Z" fill="#7d6398" stroke="#e7c7fa" stroke-width="2"/>
<circle cx="125" cy="42" r="7" fill="#ead2f5"/>
<path d="M125 48 L111 74 M125 48 L143 74" stroke="#b9a1cd" stroke-width="5"/>
</g>
<path d="M124 -24 A110 110 0 0 0 13 86 H124Z" fill="#73598d" stroke="#b594d0" stroke-width="2"/>
<path d="M182 14 A110 110 0 0 1 233 86 H169Z" fill="#73598d" stroke="#b594d0" stroke-width="2"/>
<path d="M13 86 H233" stroke="#d2b0e4" stroke-width="5"/>
<rect id="win1" x="51" y="117" width="24" height="38" rx="12" fill="#f0c9aa"/>
<rect id="win2" x="173" y="117" width="24" height="38" rx="12" fill="#f0c9aa"/>
<path d="M103 210 V160 Q124 131 145 160 V210Z" fill="#251e35" stroke="#b198c6" stroke-width="2"/>
<circle cx="138" cy="181" r="2.5" fill="#d9b48f"/>
</g>
<path d="M0 290 Q200 257 390 285 T900 276 V300 H0Z" fill="#1c182f"/>
</svg>
<div class="label">Observatório Lunar</div><div class="sub">INTELECTUAL · JORNADA</div>
<div class="mooninfo" id="moonInfo"></div>
</main>
<script>
(function(){
const CYCLE=29.530588853, NEW_MOON=Date.UTC(2000,0,6,18,14);
const phaseNames=['Lua nova','Lua crescente','Quarto crescente','Gibosa crescente','Lua cheia','Gibosa minguante','Quarto minguante','Lua minguante'];
function drawMoon(fraction){
 const canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;
 const ctx=canvas.getContext('2d'), img=ctx.createImageData(256,256);
 const a=2*Math.PI*fraction, sun=[Math.sin(a),0,-Math.cos(a)];
 for(let y=0;y<256;y++)for(let x=0;x<256;x++){
  let nx=(x-127.5)/126,ny=(y-127.5)/126,rr=nx*nx+ny*ny;
  if(rr>1)continue;
  let nz=Math.sqrt(1-rr), dot=nx*sun[0]+nz*sun[2];
  let light=Math.max(0,Math.min(1,dot*8+.5));
  let texture=1-.13*Math.sin(x*.12+y*.07)**2-.09*Math.cos(x*.045-y*.09)**2;
  let i=(y*256+x)*4, c=light*texture;
  img.data[i]=Math.round(246*c+35*(1-c));
  img.data[i+1]=Math.round(231*c+29*(1-c));
  img.data[i+2]=Math.round(251*c+55*(1-c));
  img.data[i+3]=255;
 }
 ctx.putImageData(img,0,0);
 document.getElementById('moonImage').setAttribute('href',canvas.toDataURL('image/png'));
}
function update(){
 const now=new Date(), hour=now.getHours()+now.getMinutes()/60;
 const age=(((now.getTime()-NEW_MOON)/86400000)%CYCLE)+CYCLE)%CYCLE, fraction=age/CYCLE;
 const illum=Math.round((1-Math.cos(2*Math.PI*fraction))*50);
 let name=phaseNames[Math.floor(((fraction+1/16)%1)*8)];
 document.getElementById('moonInfo').innerHTML=name+'<small>'+illum+'% iluminada · estimativa</small>';
 drawMoon(fraction);
 let colors,starOpacity,windowColor;
 if(hour>=6&&hour<16){colors=['#5e5686','#9b83b3','#e4b9c3'];starOpacity=0;windowColor='#392d4a'}
 else if(hour>=16&&hour<19){colors=['#49365f','#91658c','#dfa4a5'];starOpacity=.35;windowColor='#f0c9aa'}
 else if(hour>=4.5&&hour<6){colors=['#4a3c70','#a07da9','#e9b9c0'];starOpacity=.35;windowColor='#f0c9aa'}
 else{colors=['#10112a','#34254f','#76568a'];starOpacity=1;windowColor='#f0c9aa'}
 ['top','middle','bottom'].forEach((id,i)=>document.getElementById(id).setAttribute('stop-color',colors[i]));
 document.getElementById('stars').style.opacity=starOpacity;
 document.getElementById('win1').setAttribute('fill',windowColor);
 document.getElementById('win2').setAttribute('fill',windowColor);
 document.getElementById('glow').style.opacity=hour>=6&&hour<16?.2:1;
}
const g=document.getElementById('stars');
for(let i=0;i<110;i++){let el=document.createElementNS('http://www.w3.org/2000/svg','circle');
el.setAttribute('cx',(i*179+43)%900);el.setAttribute('cy',(i*107+23)%218);
el.setAttribute('r',i%13===0?1.6:.65);el.setAttribute('fill','#f5e9ff');
el.setAttribute('opacity',.3+(i%5)*.12);g.appendChild(el)}
update();setInterval(update,60000);
})();
</script></body></html>
